<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Agent 排行榜 2025-2026</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0d12;--surface:#13161f;--card-bg:#1a1e2b;
  --text:#e4e6ee;--text-secondary:#9298aa;
  --accent-1:#6366f1;--accent-2:#8b5cf6;--accent-3:#06b6d4;--accent-4:#10b981;
  --gold:#f59e0b;--red:#ef4444;--pink:#ec4899;
  --border:rgba(255,255,255,0.06);--radius:16px;
}
html{scroll-behavior:smooth}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--bg);color:var(--text);line-height:1.6;overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;
  background:radial-gradient(ellipse 80% 60% at 50% -20%,rgba(99,102,241,0.12),transparent),
             radial-gradient(ellipse 60% 50% at 80% 80%,rgba(139,92,246,0.08),transparent);
  pointer-events:none;z-index:0;
}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:#2a2f3d;border-radius:3px}

/* Header */
header{position:relative;z-index:1;text-align:center;padding:60px 20px 40px}
header h1{font-size:clamp(2rem,5vw,3.2rem);font-weight:800;letter-spacing:-0.02em;background:linear-gradient(135deg,var(--accent-1),var(--accent-2),var(--accent-3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:12px}
header .subtitle{font-size:1.1rem;color:var(--text-secondary);max-width:640px;margin:0 auto}
header .badge-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:20px}
header .badge-row span{font-size:0.8rem;padding:4px 12px;border-radius:20px;background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--text-secondary)}

/* Controls */
.controls{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:12px;justify-content:center;padding:0 20px 20px;max-width:1200px;margin:0 auto}
.search-box{flex:1;min-width:220px;max-width:400px;position:relative}
.search-box input{width:100%;padding:12px 16px 12px 44px;background:var(--surface);border:1px solid var(--border);border-radius:12px;color:var(--text);font-size:0.95rem;outline:none;transition:0.2s}
.search-box input:focus{border-color:var(--accent-1);box-shadow:0 0 0 3px rgba(99,102,241,0.15)}
.search-box .search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-secondary);pointer-events:none}
.sort-btn{padding:12px 20px;background:var(--surface);border:1px solid var(--border);border-radius:12px;color:var(--text);cursor:pointer;font-size:0.9rem;transition:0.2s;user-select:none}
.sort-btn:hover{background:#1e2232}
.sort-btn.active{background:rgba(99,102,241,0.15);border-color:var(--accent-1);color:var(--accent-1)}

/* Filter tags */
.filters{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:0 20px 32px}
.filter-tag{padding:10px 20px;border-radius:24px;border:1px solid var(--border);background:var(--surface);color:var(--text-secondary);cursor:pointer;font-size:0.9rem;font-weight:500;transition:0.2s;user-select:none;white-space:nowrap}
.filter-tag:hover{background:#1e2232}
.filter-tag.active{background:linear-gradient(135deg,rgba(99,102,241,0.2),rgba(139,92,246,0.2));border-color:var(--accent-1);color:#fff}
.filter-tag .count{font-size:0.75rem;opacity:0.6;margin-left:2px}

/* Stats bar */
.stats-bar{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:16px;justify-content:center;padding:0 20px 40px}
.stat-item{text-align:center;padding:16px 28px;background:var(--surface);border:1px solid var(--border);border-radius:12px;min-width:100px}
.stat-item .num{font-size:1.8rem;font-weight:700;color:var(--accent-1)}
.stat-item .label{font-size:0.8rem;color:var(--text-secondary);margin-top:2px}

/* Grid */
.grid{position:relative;z-index:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px;padding:0 20px 60px;max-width:1400px;margin:0 auto}

/* Card */
.card-wrapper{perspective:1000px;height:420px}
.card-wrapper.hidden{display:none}
.card{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform 0.6s cubic-bezier(0.4,0,0.2,1);cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border)}
.card-front{background:var(--card-bg);display:flex;flex-direction:column;padding:24px}
.card-back{background:var(--card-bg);transform:rotateY(180deg);padding:24px;overflow-y:auto}
.card-back::-webkit-scrollbar{width:3px}
.card-back::-webkit-scrollbar-thumb{background:#2a2f3d;border-radius:2px}

/* Front content */
.card-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px}
.card-icon{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;font-weight:700;flex-shrink:0}
.card-rank{font-size:0.8rem;color:var(--text-secondary);background:rgba(255,255,255,0.04);padding:4px 10px;border-radius:8px}
.card-name{font-size:1.2rem;font-weight:700;margin-bottom:4px}
.card-org{font-size:0.85rem;color:var(--text-secondary);margin-bottom:12px}
.card-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.card-tag{padding:4px 10px;border-radius:6px;font-size:0.72rem;font-weight:600;background:rgba(255,255,255,0.05);color:var(--text-secondary)}
.card-tag.cat-coding{background:rgba(99,102,241,0.15);color:#a5b4fc}
.card-tag.cat-product{background:rgba(6,182,212,0.15);color:#67e8f9}
.card-tag.cat-opensource{background:rgba(16,185,129,0.15);color:#6ee7b7}
.card-tag.cat-china{background:rgba(236,72,153,0.15);color:#f9a8d4}

.card-pros-cons{display:flex;gap:12px;margin-bottom:auto}
.card-pros-cons>div{flex:1;font-size:0.78rem}
.card-pros-cons .pros h4{color:var(--accent-4);margin-bottom:4px;font-size:0.75rem}
.card-pros-cons .cons h4{color:var(--red);margin-bottom:4px;font-size:0.75rem}
.card-pros-cons ul{list-style:none;color:var(--text-secondary);margin:0;padding:0}
.card-pros-cons li{margin-bottom:3px;padding-left:12px}
.card-pros-cons .pros li::before{content:'+';position:absolute;left:0;color:var(--accent-4)}
.card-pros-cons .cons li::before{content:'-';position:absolute;left:0;color:var(--red)}

.card-rating{display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
.card-score{font-size:1.6rem;font-weight:800;color:var(--gold)}
.card-score-label{font-size:0.75rem;color:var(--text-secondary)}
.card-stars{color:var(--gold);font-size:0.9rem;letter-spacing:2px}
.card-hint{font-size:0.7rem;color:var(--text-secondary);margin-left:auto}

/* Back content */
.card-back h3{font-size:1rem;font-weight:700;margin-bottom:14px;color:var(--accent-1)}
.back-section{margin-bottom:16px}
.back-section h4{font-size:0.8rem;font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.back-section h4 .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.dot.green{background:var(--accent-4)}.dot.red{background:var(--red)}.dot.blue{background:var(--accent-3)}
.back-section ul{list-style:none;font-size:0.8rem;color:var(--text-secondary);padding:0}
.back-section li{margin-bottom:4px;padding-left:16px}
.back-section li::before{content:'•';position:absolute;left:4px;color:var(--accent-1)}
.back-verdict{margin-top:14px;padding:12px;background:rgba(99,102,241,0.08);border-radius:10px;font-size:0.8rem;color:var(--text-secondary);line-height:1.5}
.back-verdict strong{color:var(--accent-3)}
.card-flip-hint{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px;color:var(--text-secondary);font-size:0.7rem;border-top:1px solid var(--border);margin-top:auto}
.flip-indicator{position:absolute;top:16px;right:16px;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,0.04);display:flex;align-items:center;justify-content:center;font-size:0.7rem;color:var(--text-secondary);transition:0.2s}
.card:hover .flip-indicator{background:rgba(255,255,255,0.08)}

/* Top badges */
.card-wrapper.top-1 .card-front{border-color:rgba(245,158,11,0.4);box-shadow:0 0 30px rgba(245,158,11,0.1)}
.card-wrapper.top-2 .card-front{border-color:rgba(148,163,184,0.35);box-shadow:0 0 20px rgba(148,163,184,0.08)}
.card-wrapper.top-3 .card-front{border-color:rgba(180,110,50,0.3);box-shadow:0 0 20px rgba(180,110,50,0.06)}
.top-badge{position:absolute;top:0;right:0;width:60px;height:60px;overflow:hidden;z-index:2;pointer-events:none}
.top-badge::before{content:'';position:absolute;top:0;right:0;border-style:solid;border-width:0 60px 60px 0;border-color:transparent var(--gold) transparent transparent}
.top-badge span{position:absolute;top:8px;right:-2px;transform:rotate(45deg);font-size:0.6rem;font-weight:800;color:#000;z-index:1}
.card-wrapper.top-2 .top-badge::before{border-color:transparent #94a3b8 transparent transparent}
.card-wrapper.top-3 .top-badge::before{border-color:transparent #b46e32 transparent transparent}

/* Animation */
@keyframes fadeInUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.card-wrapper{animation:fadeInUp 0.5s ease both}
.card-wrapper:nth-child(1){animation-delay:.05s}.card-wrapper:nth-child(2){animation-delay:.1s}
.card-wrapper:nth-child(3){animation-delay:.15s}.card-wrapper:nth-child(4){animation-delay:.2s}
.card-wrapper:nth-child(5){animation-delay:.25s}.card-wrapper:nth-child(6){animation-delay:.3s}
.card-wrapper:nth-child(7){animation-delay:.35s}.card-wrapper:nth-child(8){animation-delay:.4s}
.card-wrapper:nth-child(9){animation-delay:.45s}.card-wrapper:nth-child(10){animation-delay:.5s}
.card-wrapper:nth-child(11){animation-delay:.55s}.card-wrapper:nth-child(12){animation-delay:.6s}
.card-wrapper:nth-child(13){animation-delay:.62s}.card-wrapper:nth-child(14){animation-delay:.64s}

/* Responsive */
@media(max-width:768px){
  header{padding:40px 16px 28px}
  .grid{grid-template-columns:1fr;padding:0 12px 40px;gap:16px}
  .card-wrapper{height:400px}
  .controls{flex-direction:column;align-items:stretch;padding:0 12px 16px}
  .search-box{max-width:none}
  .filters{gap:6px;padding:0 12px 24px}
  .filter-tag{padding:8px 14px;font-size:0.82rem}
  .stats-bar{gap:10px;padding:0 12px 28px}
  .stat-item{padding:12px 20px;min-width:80px}
  .stat-item .num{font-size:1.4rem}
}
@media(max-width:480px){
  .card-wrapper{height:380px}
  .card-front{padding:18px}.card-back{padding:18px}
  .card-name{font-size:1.05rem}
  .card-pros-cons{flex-direction:column;gap:6px}
  .card-pros-cons>div{font-size:0.74rem}
  .filter-tag{font-size:0.76rem;padding:6px 12px}
}

footer{position:relative;z-index:1;text-align:center;padding:40px 20px;color:var(--text-secondary);font-size:0.8rem;border-top:1px solid var(--border)}
footer a{color:var(--accent-3);text-decoration:none}
</style>
</head>

function stars(n){ var s=''; for(var i=0;i<5;i++) s+= i<n ? '★' : '☆'; return s; }

var grid = document.getElementById('cardGrid');
var currentFilter = 'all';
var currentSort = 'rating';

// ===== BUILD CARDS =====
function buildCards(data){
  grid.innerHTML = '';
  for(var i = 0; i < data.length; i++){
    var a = data[i];
    var topClass = (currentSort==='rating' && i<3) ? ' top-'+(i+1) : '';
    var topBadge = (currentSort==='rating' && i<3) ? '<div class="top-badge"><span>TOP'+(i+1)+'</span></div>' : '';
    var tagHtml = '';
    for(var j = 0; j < a.cats.length; j++){
      var c = a.cats[j];
      tagHtml += '<span class="card-tag '+C[c]+'">'+CN[c]+'</span>';
    }
    // Pro list (truncated to 3 for front)
    var proHtml = '', conHtml = '', proFull = '', conFull = '';
    for(var k = 0; k < a.pros.length && k < 3; k++) proHtml += '<li>'+a.pros[k]+'</li>';
    for(var k = 0; k < a.cons.length && k < 3; k++) conHtml += '<li>'+a.cons[k]+'</li>';
    for(var k = 0; k < a.pros.length; k++) proFull += '<li>'+a.pros[k]+'</li>';
    for(var k = 0; k < a.cons.length; k++) conFull += '<li>'+a.cons[k]+'</li>';

    var w = document.createElement('div');
    w.className = 'card-wrapper'+topClass;
    w.setAttribute('data-cats', a.cats.join(','));
    w.setAttribute('data-name', a.name.toLowerCase());
    w.setAttribute('data-org', a.org.toLowerCase());
    w.setAttribute('data-rating', a.score);
    w.setAttribute('data-stars', a.stars);

    w.innerHTML =
'<div class="card">'+
  topBadge+
  '<div class="card-face card-front">'+
    '<div class="flip-indicator">&#8635;</div>'+
    '<div class="card-header">'+
      '<div class="card-icon" style="background:'+a.iconBg+'">'+a.icon+'</div>'+
      '<div class="card-rank">#'+(i+1)+' &middot; '+stars(a.stars)+'</div>'+
    '</div>'+
    '<div class="card-name">'+a.name+'</div>'+
    '<div class="card-org">'+a.org+'</div>'+
    '<div class="card-tags">'+tagHtml+'</div>'+
    '<div class="card-pros-cons">'+
      '<div class="pros"><h4>优点</h4><ul>'+proHtml+'</ul></div>'+
      '<div class="cons"><h4>缺点</h4><ul>'+conHtml+'</ul></div>'+
    '</div>'+
    '<div class="card-rating">'+
      '<span class="card-score">'+a.score+'</span>'+
      '<span class="card-score-label">/ 10</span>'+
      '<span class="card-stars">'+stars(a.stars)+'</span>'+
      '<span class="card-hint">点击翻转看详情</span>'+
    '</div>'+
  '</div>'+
  '<div class="card-face card-back">'+
    '<h3>'+a.name+' 深度分析</h3>'+
    '<div class="back-section"><h4><span class="dot blue"></span>概述</h4><p style="font-size:0.8rem;color:var(--text-secondary);line-height:1.6">'+a.detail+'</p></div>'+
    '<div class="back-section"><h4><span class="dot green"></span>全部优点</h4><ul>'+proFull+'</ul></div>'+
    '<div class="back-section"><h4><span class="dot red"></span>全部缺点</h4><ul>'+conFull+'</ul></div>'+
    '<div class="back-verdict"><strong>一句话总结：</strong>'+a.verdict+'</div>'+
    '<div class="card-flip-hint">点击翻转回正面</div>'+
  '</div>'+
'</div>';

    grid.appendChild(w);
  }
  updateCounts(data);

// ===== DELETE GATE (event delegation) =====
grid.addEventListener('click', function(e){
  var card = e.target.closest('.card');
  if(!card) return;
  e.stopPropagation();
  card.classList.toggle('flipped');
});

// ===== FILTER =====
function setFilter(cat, btn){
  currentFilter = cat;
  var tags = document.querySelectorAll('.filter-tag');
  for(var i=0;i<tags.length;i++) tags[i].classList.remove('active');
  btn.classList.add('active');
  applyFilters();
}

  var visible = 0;

  for(var i = 0; i < cards.length; i++){
    var w = cards[i];
    var cardEl = w.querySelector('.card');
    if(cardEl) cardEl.classList.remove('flipped');

    var cats = w.getAttribute('data-cats').split(',');
    var name = w.getAttribute('data-name');
    var org = w.getAttribute('data-org');
    var matchCat = currentFilter === 'all' || cats.indexOf(currentFilter) >= 0;
    var matchSearch = !query || name.indexOf(query) >= 0 || org.indexOf(query) >= 0;

    if(matchCat && matchSearch){
      w.classList.remove('hidden');
      visible++;
      w.style.animationDelay = ((visible-1)*0.04)+'s';
    } else {
      w.classList.add('hidden');
    }
  }

  // Re-rank visible
  var visibleWrappers = document.querySelectorAll('.card-wrapper:not(.hidden)');
  for(var j = 0; j < visibleWrappers.length; j++){
    var vw = visibleWrappers[j];
    var st = parseInt(vw.getAttribute('data-stars')) || 3;
    var rankEl = vw.querySelector('.card-rank');
    if(rankEl) rankEl.innerHTML = '#'+(j+1)+' &middot; '+stars(st);

    var badge = vw.querySelector('.top-badge');
    if(badge) badge.parentNode.removeChild(badge);
    vw.classList.remove('top-1','top-2','top-3');

    if(currentSort==='rating' && j<3){
      vw.classList.add('top-'+(j+1));
      var newBadge = document.createElement('div');
      newBadge.className = 'top-badge';
      newBadge.innerHTML = '<span>TOP'+(j+1)+'</span>';
      var card = vw.querySelector('.card');
      if(card) card.appendChild(newBadge);
    }
  }

  document.getElementById('totalCount').textContent = visible;
}

// ===== SORT =====
function sortBy(type){
  currentSort = type;
  var btns = document.querySelectorAll('.sort-btn');
  for(var i=0;i<btns.length;i++) btns[i].classList.remove('active');
  var activeBtn = document.querySelector('.sort-btn[data-sort="'+type+'"]');
  if(activeBtn) activeBtn.classList.add('active');

  var wrappers = [];
  var allW = document.querySelectorAll('#cardGrid .card-wrapper');
  for(var j=0;j<allW.length;j++) wrappers.push(allW[j]);

  wrappers.sort(function(a,b){
    if(type==='rating') return parseFloat(b.getAttribute('data-rating')) - parseFloat(a.getAttribute('data-rating'));
    return (a.getAttribute('data-name')||'').localeCompare(b.getAttribute('data-name')||'');
  });

  for(var k=0;k<wrappers.length;k++){
    var w = wrappers[k];
    w.classList.remove('top-1','top-2','top-3');
    var badge = w.querySelector('.top-badge');
    if(badge) badge.parentNode.removeChild(badge);
    grid.appendChild(w);
  }

  // Re-rank
  var vis = document.querySelectorAll('#cardGrid .card-wrapper:not(.hidden)');
  for(var m=0;m<vis.length;m++){
    var vw = vis[m];
    var st = parseInt(vw.getAttribute('data-stars')) || 3;
    var rankEl = vw.querySelector('.card-rank');
    if(rankEl) rankEl.innerHTML = '#'+(m+1)+' &middot; '+stars(st);
    if(type==='rating' && m<3){
      vw.classList.add('top-'+(m+1));
      var newBadge = document.createElement('div');
      newBadge.className = 'top-badge';
      newBadge.innerHTML = '<span>TOP'+(m+1)+'</span>';
      var card = vw.querySelector('.card');
      if(card) card.appendChild(newBadge);
    }
  }
}

function updateCounts(data){
  var d = data || AGENTS;
  function cnt(cat){ var n=0;for(var i=0;i<d.length;i++){if(d[i].cats.indexOf(cat)>=0)n++;} return n; }
  document.getElementById('cAll').textContent = d.length;
  document.getElementById('cCoding').textContent = cnt('coding');
  document.getElementById('cProduct').textContent = cnt('product');
  document.getElementById('cOpensource').textContent = cnt('opensource');
  document.getElementById('cChina').textContent = cnt('china');
}

// ===== BIND CONTROLS =====
document.getElementById('searchInput').addEventListener('input', applyFilters);

var filterBtns = document.querySelectorAll('.filter-tag');
for(var i=0;i<filterBtns.length;i++){
  (function(btn){
    btn.addEventListener('click', function(){
      setFilter(btn.getAttribute('data-cat'), btn);
    });
  })(filterBtns[i]);
}

var sortBtns = document.querySelectorAll('.sort-btn');
for(var j=0;j<sortBtns.length;j++){
  (function(btn){
    btn.addEventListener('click', function(){
      sortBy(btn.getAttribute('data-sort'));
    });
  })(sortBtns[j]);
}

// ===== INIT =====
var sorted = AGENTS.slice().sort(function(a,b){ return b.score - a.score; });
buildCards(sorted);

})();
</script>
